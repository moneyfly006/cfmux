name: refresh-quality
on:
  schedule:
    - cron: '17 */3 * * *'   # 每 3 小时（云端保活，Mac 关机也能跑）
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Fetch entries from panel
        env:
          BASE: ${{ vars.CFMUX_BASE }}
          TOKEN: ${{ secrets.CFMUX_REPORT_TOKEN }}
        run: |
          curl -sS --max-time 30 "$BASE/api/quality/entries" -H "x-report-token: $TOKEN" -o entries.json
          python3 -c "import json;d=json.load(open('entries.json'));print('entries:',len(d['entries']),'preferred:',len(d['preferred']));open('pref.txt','w').write(chr(10).join(map(str,d['preferred'][:40])))"
      - name: Measure
        run: |
          node tools/quality.mjs --entries entries.json --preferred pref.txt --out quality.json --timeout 8000 --bytes 262144 --concurrency 6 || true
      - name: Report to panel
        env:
          BASE: ${{ vars.CFMUX_BASE }}
          TOKEN: ${{ secrets.CFMUX_REPORT_TOKEN }}
        run: |
          python3 -c "
import json
q=json.load(open('quality.json'))
json.dump({'source':'github-actions','quality':q}, open('report.json','w'))
print('report items:', len(q))"
          curl -sS --max-time 60 -X POST "$BASE/api/quality/report" -H "x-report-token: $TOKEN" -H "Content-Type: application/json" --data-binary @report.json
