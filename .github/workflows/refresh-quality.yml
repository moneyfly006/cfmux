name: refresh-quality
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch entries
        env:
          BASE: ${{ vars.CFMUX_BASE }}
          TOKEN: ${{ secrets.CFMUX_REPORT_TOKEN }}
        run: |
          curl -sS --max-time 30 "$BASE/api/quality/entries" -H "x-report-token: $TOKEN" -o entries.json
          node -e "const d=require('./entries.json');require('fs').writeFileSync('pref.txt', (d.preferred||[]).slice(0,40).join('\n'));console.log('entries',d.entries.length,'pref',Math.min(40,(d.preferred||[]).length))"
      - name: Measure
        run: node tools/quality.mjs --entries entries.json --preferred pref.txt --out quality.json --timeout 8000 --bytes 262144 --concurrency 6 || true
      - name: Report
        env:
          BASE: ${{ vars.CFMUX_BASE }}
          TOKEN: ${{ secrets.CFMUX_REPORT_TOKEN }}
        run: |
          node -e "const q=require('./quality.json');require('fs').writeFileSync('report.json',JSON.stringify({source:'github-actions',quality:q}));console.log('report',Object.keys(q).length)"
          curl -sS --max-time 60 -X POST "$BASE/api/quality/report" -H "x-report-token: $TOKEN" -H "Content-Type: application/json" --data-binary @report.json
